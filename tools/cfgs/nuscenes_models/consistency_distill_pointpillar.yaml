        NMS_CONFIG:
            MULTI_CLASSES_NMS: True
            NMS_TYPE: nms_gpu
            NMS_THRESH: 0.2
            NMS_PRE_MAXSIZE: 1000
            NMS_POST_MAXSIZE: 83


# ---- optimization, byte-identical across exp 1 / 2 / 3 ----
# Changing any of these means changing all three files, otherwise the
# comparison stops being a comparison.
OPTIMIZATION:
    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 20

    OPTIMIZER: adam_onecycle
    LR: 0.001
    WEIGHT_DECAY: 0.01
    MOMENTUM: 0.9

    MOMS: [0.95, 0.85]
    PCT_START: 0.4
    DIV_FACTOR: 10
    DECAY_STEP_LIST: [35, 45]
    LR_DECAY: 0.1
    LR_CLIP: 0.0000001

    LR_WARMUP: False
    WARMUP_EPOCH: 1

    GRAD_NORM_CLIP: 10

# ===========================================================================
# exp 3 -- exp 2 plus beam-wise mixing consistency.
#
# Only difference from exp 2: CONS_WEIGHT and the BWM block. The KD term runs
# through the exact same code path (ConsistencyDistillPP subclasses
# DistillPointPillar), so any delta is attributable to the consistency term.
#
# Cost: ~2.3x the exp 1 step time (three forwards per step). If this OOMs,
# BATCH_SIZE_PER_GPU can drop to 2 -- but then it has to drop in all three
# files, since batch size changes BN statistics and the LR schedule.
#
# Metrics to watch, beyond exp 2's:
#   bwm_partner_ratio  fraction of points taken from the partner scene. Should
#                      sit near 0.5. Far off means the bands are unbalanced and
#                      little real mixing happens, in which case cons_loss just
#                      converges onto kd_loss and exp 3 degenerates into exp 2.
#   bwm_mask_mean      fraction of BEV *area* fed by the sample itself. NOT
#                      expected to be 0.5: with uniform pitch bands the far
#                      field collapses into a single band, so the area is
#                      skewed even when the point split is balanced.
#
# Further ablations, once the main three are in:
#   CONS_WEIGHT: 0.0          isolates the cost of the third forward alone
#   BWM.MASK_MODE: analytic   tells you whether raster's extra cost pays off
#   BWM.BAND_MODE: quantile   fixes an unbalanced bwm_partner_ratio
#   BWM.NUM_AREAS: [4]        removes the band-count randomness
# ===========================================================================
