CLASS_NAMES: ['car','truck', 'construction_vehicle', 'bus', 'trailer',
              'barrier', 'motorcycle', 'bicycle', 'pedestrian', 'traffic_cone']

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/nuscenes_dataset.yaml

    POINT_CLOUD_RANGE: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
    DATA_PROCESSOR:
        -   NAME: mask_points_and_boxes_outside_range
            REMOVE_OUTSIDE_BOXES: True

        -   NAME: shuffle_points
            SHUFFLE_ENABLED: {
                'train': True,
                'test': True
            }

        # Dynamic pillars: the dataloader does NOT voxelize, DynPillarVFE
        # consumes raw points. Identical in all three experiments -- see the
        # note at the bottom of this file for why the baseline was moved off
        # the static PillarVFE.
        -   NAME: transform_points_to_voxels_placeholder
            VOXEL_SIZE: [0.2, 0.2, 8.0]

MODEL:
    NAME: ConsistencyDistillPP

    # ---- distillation (inherited from exp 2, keep identical) ----
    TEACHER_CFG_FILE: cfgs/nuscenes_models/cbgs_dyn_pp_centerpoint.yaml
    TEACHER_CKPT: /root/ckpt/cbgs_pp_centerpoint_nds6070.pth

    NORMALIZE_FEATURES: True
    KD_LOSS_WEIGHT: 1.0
    WARMUP_STEPS: 500

    # ---- beam-wise mixing (exp 3, the only addition over exp 2) ----
    CONS_WEIGHT: 1.0
    BWM:
        ENABLED: True
        # Number of pitch bands, resampled every iteration.
        NUM_AREAS: [3, 4, 5, 6]
        # nuScenes ships a 32-beam Velodyne HDL-32E: +10 to -30 degrees.
        # Getting this wrong is the most likely way to make BWM a no-op.
        PITCH_RANGE_DEG: [-30.0, 10.0]
        # uniform  = equal width in pitch, as in LaserMix
        # quantile = equal point count per band. Try this if bwm_partner_ratio
        #            drifts away from 0.5, which happens on a 32-beam sensor
        #            because returns bunch up near the horizon.
        BAND_MODE: uniform
        # LiDAR height above ground, negative. Only fills BEV cells that no
        # point lands in.
        GROUND_Z: -1.8
        # raster   = mask built from where the mixed points actually landed
        # analytic = pure concentric rings from the flat-ground model
        MASK_MODE: raster
        SOFT_MASK: True

    # ---- student, byte-identical across exp 1 / 2 / 3 ----
    VFE:
        NAME: DynPillarVFE
        WITH_DISTANCE: False
        USE_ABSLOTE_XYZ: True
        USE_NORM: True
        NUM_FILTERS: [64, 64]

    MAP_TO_BEV:
        NAME: PointPillarScatter
        NUM_BEV_FEATURES: 64

    BACKBONE_2D:
        NAME: BaseBEVBackbone
        LAYER_NUMS: [3, 5, 5]
        LAYER_STRIDES: [2, 2, 2]
        NUM_FILTERS: [64, 128, 256]
        UPSAMPLE_STRIDES: [0.5, 1, 2]
        NUM_UPSAMPLE_FILTERS: [128, 128, 128]

    DENSE_HEAD:
        NAME: AnchorHeadMulti
        CLASS_AGNOSTIC: False

        DIR_OFFSET: 0.78539
        DIR_LIMIT_OFFSET: 0.0
        NUM_DIR_BINS: 2

        USE_MULTIHEAD: True
        SEPARATE_MULTIHEAD: True
        ANCHOR_GENERATOR_CONFIG: [
